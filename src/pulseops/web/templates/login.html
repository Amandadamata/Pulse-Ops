{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Entrar</h1>
  {% if error %}<p class="alert alert-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Usuário</label>
    <input id="username" name="username" autocomplete="username" required maxlength="50" autofocus>
    <label for="password">Senha</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="button button-primary">Entrar</button>
  </form>
  <p class="muted small">O operador é criado pela linha de comando: <code>pulseops create-admin</code>.</p>
</section>
{% endblock %}
