[project]
name = "pulseops"
version = "0.1.0"
description = "Monitoramento explicável de APIs HTTP: verificações, incidentes por limiar e alertas por webhook."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.159.1",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pulseops = "pulseops.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "ASYNC", "DTZ", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # acentos e aspas tipográficas em textos em português

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"lab/**" = ["S104"]
"scripts/**" = ["S101"]
"migrations/versions/**" = ["E501"]
# Gerador do material de estudo: chama git, pandoc e node com argumentos fixos.
"study/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/pulseops", "lab", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["pulseops"]
branch = true
# O SQLAlchemy assíncrono executa partes do código dentro de greenlets; sem isto,
# linhas executadas aparecem como não cobertas.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false
